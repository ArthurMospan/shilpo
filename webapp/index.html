<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/shilpo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#e85d0b" />
    <title>Шільпо — мій список</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- The bundle takes a moment over a phone connection; without this the
         guest stares at a white rectangle after tapping the button. React
         replaces the whole node on its first render. -->
    <style>
      #boot {
        position: fixed; inset: 0;
        display: grid; place-content: center; justify-items: center; gap: 20px;
        background: radial-gradient(circle at 50% 42%, #fff4ea 0, #f7f7f5 52%);
      }
      #boot img { width: auto; height: 46px; animation: boot-breathe 1.9s ease-in-out infinite; }
      #boot i {
        width: 32px; height: 32px;
        border: 3px solid #ebebe5; border-top-color: #f97316; border-radius: 50%;
        animation: boot-spin .75s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-breathe {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: .72; transform: scale(.965); }
      }
      @media (prefers-reduced-motion: reduce) { #boot img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot"><img src="/shilpo.png" alt="Шільпо" /><i></i></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
