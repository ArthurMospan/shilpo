services:
  - type: web
    name: shilpo
    runtime: node
    plan: free
    region: frankfurt
    # NODE_ENV=production below also applies during the build, and npm skips
    # devDependencies in that mode — which would leave TypeScript and Vite
    # missing. --include=dev keeps the build toolchain available while the
    # runtime still starts in production mode.
    buildCommand: npm ci --include=dev --prefix bot && npm ci --include=dev --prefix webapp && npm run build --prefix webapp && npm run build --prefix bot
    startCommand: npm run start --prefix bot
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard — never commit them.
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
